name: Migrate database

# Applies new files in supabase/migrations after CI passes on a release branch, each to its own
# Supabase project: main to production, qa to QA, dev to dev. `supabase db push` only runs
# migrations the database has not seen yet, so a run with nothing new is a no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, qa, dev]
  workflow_dispatch:
    inputs:
      target:
        description: Branch whose database to migrate (main is production)
        type: choice
        options: [dev, qa, main]
        default: dev

permissions:
  contents: read

concurrency:
  group: migrate-${{ inputs.target || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  push:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PROD_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      QA_REF: ${{ secrets.QA_SUPABASE_PROJECT_REF }}
      QA_PASSWORD: ${{ secrets.QA_SUPABASE_DB_PASSWORD }}
      DEV_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
      DEV_PASSWORD: ${{ secrets.DEV_SUPABASE_DB_PASSWORD }}
      TARGET: ${{ inputs.target || github.event.workflow_run.head_branch }}
    steps:
      - name: Pick the target project
        id: gate
        run: |
          case "$TARGET" in
            main) branch=main; ref="$PROD_REF"; password="$PROD_PASSWORD" ;;
            qa) branch=qa; ref="$QA_REF"; password="$QA_PASSWORD" ;;
            dev) branch=dev; ref="$DEV_REF"; password="$DEV_PASSWORD" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac
          if [ "$branch" != main ] && [ -n "$ref" ] && [ "$ref" = "$PROD_REF" ]; then
            echo "::error::The $branch project ref is the production ref. Refusing to migrate production from $branch."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ref" ] || [ -z "$password" ]; then
            # QA can share the dev database; then its secrets stay unset and dev migrates it.
            echo "::notice::Supabase secrets for $branch are not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_PASSWORD=$password" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          # The commit CI just tested, or the tip of the target's branch when run by hand.
          ref: ${{ github.event.workflow_run.head_sha || steps.gate.outputs.branch }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - name: Link the ${{ steps.gate.outputs.branch }} project
        if: steps.gate.outputs.skip != 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List pending migrations
        if: steps.gate.outputs.skip != 'true'
        run: npx supabase db push --dry-run
      - name: Apply migrations
        if: steps.gate.outputs.skip != 'true'
        run: npx supabase db push
