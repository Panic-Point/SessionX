name: Branch flow

# Changes move feature branch -> dev -> main. This check fails a pull request into main that does
# not come from dev, and is meant to be a required status check on main.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$HEAD" != dev ]; then
            echo "::error::Pull requests into main must come from dev (this one is from $HEAD). Open it against dev instead."
            exit 1
          fi
