name: Cron

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the app is deployed
        id: gate
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET repo secret is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger scheduled jobs
        if: steps.gate.outputs.skip != 'true'
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron"
