name: Cron

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the app is deployed
        id: gate
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET repo secret is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger scheduled jobs
        if: steps.gate.outputs.skip != 'true'
        # SvelteKit treats a POST with no Content-Type and no Origin as a cross-site form
        # submission and answers 403, so the JSON content type is required.
        run: >-
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET"
          -H "Content-Type: application/json" "${APP_URL%/}/api/cron"
