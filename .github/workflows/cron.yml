name: Cron

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # One job for every site keeps the bill at one Actions minute an hour. Each site is skipped
      # until its URL and secret are set, and a failure on one still lets the others run.
      # SvelteKit treats a POST with no Content-Type and no Origin as a cross-site form
      # submission and answers 403, so the JSON content type is required.
      - name: Production
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: &tick |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::App URL or cron secret for this site is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" "${APP_URL%/}/api/cron"
      - name: Dev
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.DEV_APP_URL }}
          CRON_SECRET: ${{ secrets.DEV_CRON_SECRET }}
        run: *tick
